<p id="note">Blue: oxygen-poor blood. Red: oxygen-rich blood. Each colour has one meaning; the lightness differs too (blue is darker), and the numbers and labels carry the meaning without colour. Add ?step=3 to freeze on a step.</p>
</main>
<script>
// Steps 1 to 9 follow the blood: body, right atrium, right ventricle, pulmonary artery, lungs, pulmonary veins,
// left atrium, left ventricle, aorta. The current step is at full strength, earlier steps stay at 45 %, later ones are hidden.
const TEXT = [
  'Blood that has given up its oxygen comes back from the body (blue).',
  'It fills the right atrium.',
  'It is pushed into the right ventricle.',
  'The right ventricle sends it up the pulmonary artery.',
  'In the lungs it picks up oxygen (the blue turns red).',
  'Oxygen-rich blood returns by the pulmonary veins.',
  'It fills the left atrium.',
  'It is pushed into the left ventricle, the strongest chamber.',
  'The left ventricle drives it out through the aorta to the body, and the round starts again.'];
const parts = [...document.querySelectorAll('[data-step]')];
const $ = (id) => document.getElementById(id);
let step = 9, all = true;
function render() {
  parts.forEach((p) => {
    const n = +p.dataset.step;
    p.style.opacity = all ? 1 : (n > step ? 0 : n === step ? 1 : 0.45);
  });
  $('caption').textContent = all ? 'All nine steps. Follow the numbers, 1 to 9.' : step + '. ' + TEXT[step - 1];
  $('all').setAttribute('aria-pressed', String(all));
}
$('next').onclick = () => { if (all) { all = false; step = 1; } else step = Math.min(9, step + 1); render(); };
$('prev').onclick = () => { if (all) { all = false; step = 9; } else step = Math.max(1, step - 1); render(); };
$('all').onclick = () => { all = !all; if (!all) step = Math.min(step, 9) || 1; render(); };
addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); });
const q = new URLSearchParams(location.search);
if (q.has('step')) { all = false; step = Math.max(1, Math.min(9, +q.get('step') || 1)); }
render();
window.__ready = true;
</script>
